# Render Blueprint — deploy with: Render dashboard → New → Blueprint → pick this repo.
# Database + file storage are external (Supabase).
# Set every `sync: false` value in the dashboard when prompted.
#
# This file is authoritative. A blueprint sync overwrites `plan` and every env
# var declared with a literal `value:`, so change those here, never in the
# dashboard. `sync: false` vars keep whatever the dashboard holds — which is why
# every secret is declared that way, including ones the blueprint doesn't need.
services:
  - type: web
    name: nero
    runtime: python
    plan: starter
    region: frankfurt          # change to the region nearest your users
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn Nero_platform.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --threads 4 --timeout 120 --access-logfile - --error-logfile -"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true     # Render generates a strong random value
      - key: ENCRYPTION_KEY
        sync: false             # set manually: Fernet.generate_key()
      - key: ALLOWED_HOSTS
        sync: false             # e.g. nero.onrender.com,yourdomain.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false             # e.g. https://nero.onrender.com
      - key: DATABASE_URL
        sync: false             # paste your Supabase POOLER connection string (URI)
      # Object storage for uploads (Cloudflare R2 / S3) — set when ready:
      - key: USE_S3_MEDIA
        value: "1"              # "0" serves media from local disk, which is wiped on redeploy
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false              # Supabase: https://<ref>.supabase.co/storage/v1/s3
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false              # Supabase project region, e.g. eu-central-1
      - key: S3_ADDRESSING_STYLE
        value: "path"            # Supabase requires path-style (R2/S3 use virtual)
      - key: S3_CUSTOM_DOMAIN
        sync: false              # public bucket: <ref>.supabase.co/storage/v1/object/public/<bucket>
      # Private PHI bucket for medical reports and movement videos.
      # Set these to a separate private bucket so patient files are not mixed
      # with public clinic media.
      - key: PHI_S3_BUCKET
        sync: false
      - key: PHI_S3_ENDPOINT_URL
        sync: false
      - key: PHI_S3_ACCESS_KEY_ID
        sync: false
      - key: PHI_S3_SECRET_ACCESS_KEY
        sync: false
      - key: PHI_S3_REGION
        sync: false
      - key: PHI_S3_ADDRESSING_STYLE
        value: "path"
      - key: SENTRY_DSN
        sync: false             # optional error tracking
      # Google login (optional): set both to enable "Continue with Google"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Email (optional): leave blank to log emails instead of sending. To send,
      # set EMAIL_HOST + creds from a provider (Brevo/Resend/Gmail).
      - key: EMAIL_HOST
        sync: false             # e.g. smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false             # e.g. Nero <you@yourdomain.com>
      - key: BREVO_API_KEY
        sync: false             # set to send over the Brevo HTTPS API instead of SMTP
      - key: SITE_BASE_URL
        sync: false             # e.g. https://nero.onrender.com (email links/images)
      # Google Calendar OAuth (separate client from the login one above).
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_BASE
        sync: false             # e.g. https://nero.onrender.com

# No Render database — Postgres is hosted on Supabase (set DATABASE_URL above).
